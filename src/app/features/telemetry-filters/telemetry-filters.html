<aside class="filter-panel glass-panel">
  <h3>Spatial Telemetry Filters</h3>
  <form (submit)="$event.preventDefault()">
    <div class="form-group">
      <label>Target Species</label>
      <select [value]="species()" (change)="onSpeciesChange($event)">
        <option value="ALL">All Species Systems</option>
        <option value="AVIAN_MIGRATORY">Avian Migratory</option>
        <option value="MARINE_CETACEAN">Marine Cetacean</option>
        <option value="TERRESTRIAL_UNGULATE">Terrestrial Ungulate</option>
      </select>
    </div>

    <div class="form-group">
      <label>Min Heart Rate (BPM): {{ minHeartRate() }}</label>
      <input
        type="range"
        min="20"
        max="120"
        [value]="minHeartRate()"
        (input)="onMinHeartRateChange($event)"
      />
    </div>

    <div class="form-group">
      <label>Max Heart Rate (BPM): {{ maxHeartRate() }}</label>
      <input
        type="range"
        min="121"
        max="220"
        [value]="maxHeartRate()"
        (input)="onMaxHeartRateChange($event)"
      />
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          [checked]="liveStreamEnabled()"
          (change)="onLiveStreamChange($event)"
        />
        Enable Real-Time Ingestion
      </label>
    </div>
  </form>
</aside>
